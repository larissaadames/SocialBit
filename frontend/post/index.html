<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialBit - Post</title>
    <link rel="icon" type="image/png" href="/public/img/bitCafé.png">
    <link rel="stylesheet" href="/public/home/style.css?v=20260607">
    <link rel="stylesheet" href="/public/post/style.css?v=20260608c">
</head>
<body class="dark-theme">
    <div id="notification-container"></div>

    <header class="app-header">
        <div class="header-container">
            <a href="/home" class="logo-section logo-link">
                <span class="logo-text">SocialBit</span>
                <img src="/public/img/bitCodando.png" alt="Logo SocialBit" class="logo-icon-img">
            </a>

            <div class="post-header-actions-page">
                <div class="user-menu-wrapper">
                    <div class="header-user-avatar" id="header-avatar" style="background-image: url('/public/img/bitPerfil.png');"></div>
                    <div id="user-dropdown" class="dropdown-menu">
                        <a href="/perfil" class="dropdown-item">Acessar Perfil</a>
                        <button id="btn-logout-trigger" class="dropdown-item logout-style">Sair</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="post-page-main" data-post-id="">
        <section class="post-detail-card" id="post-detail">
            <p class="post-detail-loading">Carregando post...</p>
        </section>

        <section class="comments-panel">
            <h2>Comentários</h2>
            <form class="comment-form" id="main-comment-form">
                <textarea id="main-comment-input" class="comment-input" maxlength="500" placeholder="Escreva um comentário..."></textarea>
                <input type="file" id="main-comment-image" accept="image/*" class="comment-file">
                <div id="main-comment-image-name" class="comment-image-name"></div>
                <div class="comment-form-actions">
                    <span id="main-comment-counter" class="comment-counter">0/500</span>
                    <label for="main-comment-image" class="comment-image-btn" title="Adicionar imagem"><span class="image-icon"></span></label>
                    <button type="button" id="cancel-main-comment" class="comment-cancel-btn" title="Cancelar">x</button>
                    <button type="submit" class="comment-send-btn" title="Enviar">&gt;</button>
                </div>
            </form>
            <div id="comment-list" class="comment-list">
                <p class="comments-message">Carregando comentários...</p>
            </div>
        </section>
    </main>

    <div id="logout-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h3>Deseja mesmo sair?</h3>
            <p>Você precisará fazer login novamente.</p>
            <div class="modal-actions">
                <button id="confirm-logout" class="btn-confirm">Sim, Sair</button>
                <button id="cancel-logout" class="btn-cancel">Cancelar</button>
            </div>
        </div>
    </div>

    <script src="/public/api-config.js"></script>
    <script src="/public/session.js?v=20260608a"></script>
    <script src="/public/post/script.js?v=20260608d"></script>
</body>
</html>
